<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByurCinema — Movie Explorer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-film"></i>
                <a href="index.html" style="color: inherit; text-decoration: none;"><span>ByurCinema</span></a>
            </div>
            
            <form id="search-form" class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Փնտրել ֆիլմ...">
            </form>

            <div class="header-right">
                <!-- Սիրուն Watchlist կոճակ -->
                <button id="favorites-btn" class="watchlist-nav-btn">
                    <i class="fa-solid fa-bookmark"></i>
                    <span>Watchlist</span>
                </button>

                <div class="social-links">
                    <a href="https://github.com/GorSargsyan789" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
                    <a href="https://www.linkedin.com/in/gor-sargsyan-9aa892370/" target="_blank" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
                </div>

                <div id="auth-buttons">
                    <button id="open-login-btn" style="padding: 8px 18px; margin-right: 10px; cursor: pointer; background-color: #e50914; color: white; border: none; border-radius: 4px; font-weight: bold;">
                        <i class="fa-solid fa-right-to-bracket"></i> Մուտք
                    </button>
                    <button id="open-register-btn" style="padding: 8px 18px; cursor: pointer; background-color: transparent; color: white; border: 1px solid white; border-radius: 4px; font-weight: bold;">
                        <i class="fa-solid fa-user-plus"></i> Գրանցվել
                    </button>
                </div>
            </div>
        </header>

        <!-- CATEGORIES FILTER BAR -->
        <nav class="categories-bar">
            <button class="cat-btn active" data-type="trending"><i class="fa-solid fa-fire"></i> Trending</button>
            <button class="cat-btn" data-type="popular"><i class="fa-solid fa-star"></i> Popular</button>
            <button class="cat-btn" data-type="top_rated"><i class="fa-solid fa-trophy"></i> Top Rated</button>
            <button class="cat-btn" data-type="upcoming"><i class="fa-solid fa-calendar-days"></i> Upcoming</button>
            <button class="cat-btn" data-type="tv"><i class="fa-solid fa-tv"></i> TV Series</button>
            <button class="cat-btn" data-genre="28"><i class="fa-solid fa-gun"></i> Action</button>
            <button class="cat-btn" data-genre="35"><i class="fa-solid fa-masks-theater"></i> Comedy</button>
        </nav>

        <main>
            <h2 id="section-title">Trending Movies</h2>
            <div id="movies-grid" class="movies-grid"></div>
        </main>
    </div>

    <!-- MODAL POPUP FOR AUTH -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-card">
            <span id="close-modal" class="close-btn">&times;</span>
            <h2 id="modal-title" style="margin-top: 0; text-align: center;">Մուտք</h2>
            
            <form id="auth-form">
                <input type="text" id="username" placeholder="Օգտանուն (Username)" required>
                <input type="password" id="password" placeholder="Գաղտնաբառ (Password)" required>
                <button type="submit" id="modal-submit-btn">Մուտք գործել</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
