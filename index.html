<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePulse — Movie Explorer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-film"></i>
                <a href="index.html" style="color: inherit; text-decoration: none;"><span>ByurCinema</span></a>
            </div>
            
            <form id="search-form" class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Փնտրել ֆիլմ...">
            </form>

            <div class="header-right">
                <button id="favorites-btn" class="nav-btn">
                    <i class="fa-solid fa-heart"></i>
                    <span>Watchlist</span>
                </button>
                <div class="social-links">
                    <a href="https://github.com/GorSargsyan789" target="_blank"><i class="fa-brands fa-github"></i></a>
                    <a href="https://www.linkedin.com/in/gor-sargsyan-9aa892370/" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
                </div>
            </div>
	    <button id="login-btn">Մուտք</button>
            <button id="register-btn">Գրանցվել</button>  
      </header>

        <!-- CATEGORIES FILTER BAR -->
        <nav class="categories-bar">
            <button class="cat-btn active" data-type="trending"><i class="fa-solid fa-fire"></i> Trending</button>
            <button class="cat-btn" data-type="popular"><i class="fa-solid fa-star"></i> Popular</button>
            <button class="cat-btn" data-type="top_rated"><i class="fa-solid fa-trophy"></i> Top Rated</button>
            <button class="cat-btn" data-type="upcoming"><i class="fa-solid fa-calendar-days"></i> Upcoming</button>
            <button class="cat-btn" data-type="tv"><i class="fa-solid fa-tv"></i> TV Series</button>
            <button class="cat-btn" data-genre="28"><i class="fa-solid fa-gun"></i> Action</button>
            <button class="cat-btn" data-genre="35"><i class="fa-solid fa-masks-theater"></i> Comedy</button>
        </nav>

        <main>
            <h2 id="section-title">Trending Movies</h2>
            <div id="movies-grid" class="movies-grid"></div>
        </main>
    </div>
<!-- Modal Window -->
<div id="auth-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
  <div style="background: #1e1e1e; padding: 25px; border-radius: 8px; width: 300px; color: white; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
    <span id="close-modal-btn" style="position: absolute; right: 15px; top: 10px; cursor: pointer; font-size: 22px;">&times;</span>
    <h2 id="modal-title" style="text-align: center; margin-top: 0;">Մուտք</h2>
    <form id="auth-form">
      <input type="text" id="username" placeholder="Օգտանուն" required style="width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; background: #333; color: white; border: 1px solid #444; border-radius: 4px;">
      <input type="password" id="password" placeholder="Գաղտնաբառ" required style="width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; background: #333; color: white; border: 1px solid #444; border-radius: 4px;">
      <button type="submit" id="modal-submit-btn" style="width: 100%; padding: 10px; background: #e50914; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;">Մուտք գործել</button>
    </form>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
