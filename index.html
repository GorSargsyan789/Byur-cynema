<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePulse — Movie Explorer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-film"></i>
                <span>CinePulse</span>
            </div>
            
            <form id="search-form" class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Փնտրել ֆիլմ...">
            </form>

            <div class="header-right">
                <button id="favorites-btn" class="nav-btn">
                    <i class="fa-solid fa-heart"></i>
                    <span>Watchlist</span>
                </button>
                <div class="social-links">
                    <a href="https://github.com/GorSargsyan789" target="_blank"><i class="fa-brands fa-github"></i></a>
                    <a href="https://www.linkedin.com/in/gor-sargsyan-9aa892370/" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
                </div>
            </div>
        </header>

        <main>
            <h2 id="section-title">Trending Movies</h2>
            <div id="movies-grid" class="movies-grid">
            </div>
        </main>
    </div>

    <div id="movie-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <div id="modal-body">
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
